# Netlify Configuration for JUJU MARKET
# Auto-configures build, redirects, dan environment

[build]
  command = "npm install next@latest && npm run build"
  publish = ".next"

# Use Next.js plugin for full Next.js support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (Firebase config)
# These are public by design (Firebase client SDK)
[build.environment]
  NEXT_PUBLIC_USE_FIREBASE = "true"
  NEXT_PUBLIC_FB_API_KEY = "AIzaSyDNZP_FdatBlV4K1ATNO-xAIEU7LSNDMsM"
  NEXT_PUBLIC_FB_AUTH_DOMAIN = "jujumarket.firebaseapp.com"
  NEXT_PUBLIC_FB_DATABASE_URL = "https://jujumarket-default-rtdb.asia-southeast1.firebasedatabase.app"
  NEXT_PUBLIC_FB_PROJECT_ID = "jujumarket"
  NEXT_PUBLIC_FB_STORAGE_BUCKET = "jujumarket.firebasestorage.app"
  NEXT_PUBLIC_FB_MESSAGING_SENDER_ID = "909104969540"
  NEXT_PUBLIC_FB_APP_ID = "1:909104969540:web:bcbcdc4de7c25a6e9ac911"
  NODE_VERSION = "20"

# Redirects for SPA routes (each page accessible via /pagename)
# Netlify will serve index.html for all these routes
[[redirects]]
  from = "/download"
  to = "/"
  status = 200

[[redirects]]
  from = "/Dashboard"
